apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-lab
spec:
  replicas: 1
  selector:
    matchLabels: {app: probe-lab}
  template:
    metadata:
      labels: {app: probe-lab}
    spec:
      containers:
        - name: server
          image: busybox:1.36.1
          command: [sh, -ec]
          args:
            - mkdir -p /tmp/www; echo available > /tmp/www/index.html; touch /tmp/ready; exec httpd -f -p 8080 -h /tmp/www
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            exec:
              command: [sh, -c, test -f /tmp/ready]
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 5m, memory: 4Mi}
            limits: {cpu: 100m, memory: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: probe-lab
spec:
  selector: {app: probe-lab}
  ports:
    - {port: 80, targetPort: http}
