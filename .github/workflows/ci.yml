# Regression gates (P5 `ci-gates`). Runs on every push and pull request with locked dependencies.
# Needs no private data, local models, API keys or personal services: backend tests use the fake
# model provider and the SQLite retrieval repository; frontend tests mock fetch; browser journeys run
# Playwright against the seeded sandbox stack (`make dev-sandbox`, no Qdrant, hosted providers off). Live checks
# (`make bench s=<n>`, `make evals`, media/STT with a pulled model) are *not* CI — they are labelled
# "live" in docs/slices/ci-gates.md and run on the owner's machine only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  ANTHROPIC_API_KEY: ""
  HF_TOKEN: ""
  CI: "true"

jobs:
  scope:
    name: determine required runtime gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check sanitized publication contents
        if: github.repository == 'esterkane/audhs-tutor'
        run: python3 scripts/check_publication.py
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py >> "$GITHUB_OUTPUT"

  backend:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: backend · ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install Python 3.12 and locked dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Lockfile is in sync with pyproject
        run: uv lock --check
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Types
        run: uv run mypy app
      - name: Unit + route tests (fake providers, SQLite repo)
        run: uv run pytest -q

  frontend:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: frontend · tsc, eslint, vitest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Types
        run: pnpm exec tsc -b
      - name: Lint
        run: pnpm lint
      - name: Component tests (mocked fetch, axe)
        run: pnpm exec vitest run

  migrations:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: migrations · upgrade path on an empty database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: |
          uv python install 3.12
          uv sync --frozen
      - name: Every migration applies from an empty database, up and one step down again
        run: |
          export DATABASE_URL="sqlite+aiosqlite:///$RUNNER_TEMP/ci.db"
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic current

  journeys:
    needs: scope
    if: needs.scope.outputs.runtime == 'true'
    name: browser journeys · playwright on the sandbox stack
    runs-on: ubuntu-latest
    # Measured Linux run reached test292 at25min; retain the complete serial suite.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Backend (locked) for the sandbox stack
        run: |
          uv python install 3.12
          cd backend && uv sync --frozen
      - name: Frontend (locked) + the pinned Chromium build
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Pinned Pyodide runtime (cache keyed by the manifest)
        uses: actions/cache@v4
        with:
          path: frontend/public/pyodide
          key: pyodide-${{ hashFiles('frontend/pyodide.manifest.json') }}
      - name: Install / verify the runtime (downloads only what the cache lacks)
        run: make pyodide
      - name: Journeys (fresh seeded sandbox DB, hosted providers off, code runs offline)
        run: make test-e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
