[project]
name = "audhs-tutor"
version = "0.1.0"
description = "AuDHS-Tutor backend — Learning Kernel, Tutor Orchestrator, API"
authors = [
    { name = "Saru", email = "sruzic@googlemail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "fsrs>=6.3.2",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "huggingface-hub>=1.32.0",
    "instructor>=1.17.0",
    "litellm>=1.101.0",
    "numpy>=2.5.3",
    "openai>=2.54.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.54",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]



[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
# optional: audio/video transcription at ingest (MLX Whisper; macOS arm64). `uv sync --group stt`
stt = [
    "mlx-whisper>=0.4.2",
    "scipy>=1.18.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120  # formatter wraps at 100; long literals/docstrings tolerated to 120

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: needs local services (Qdrant/Ollama); skipped when unreachable"]
