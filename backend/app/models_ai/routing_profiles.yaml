# TaskClass -> registry ids (ADR-0001, ADR-0010). Inspectable, learner-overridable.
# The router walks [learner override, primary, *fallbacks] and picks the first entry whose
# registry status is `ready`. Anything but position 0 is logged as route=fallback.
# Hosted entries need ANTHROPIC_API_KEY and are subject to the daily budget (degraded -> next local).

registry_defaults:
  # Budget uses the cache-write ceiling ($0.125/M), not the $0.10 uncached headline rate.
